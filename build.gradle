buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.yaml:snakeyaml:2.3' }
}
import org.yaml.snakeyaml.Yaml

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}
def appYml = new Yaml().load(file('src/main/resources/application.yaml').newInputStream())
def appName = appYml.spring.application.name
def repoName = appName.toLowerCase()


def gitOutput = providers.exec {
    commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
    ignoreExitValue = true
}
def gitSha = gitOutput.result.map { r ->
    r.exitValue == 0 ? gitOutput.standardOutput.asText.get().trim() : 'unknown'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'URlShortener'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}
def registryUser = providers.gradleProperty('registryUser')
        .orElse(providers.environmentVariable('REGISTRY_USER'))
def imageBase = registryUser.map { u -> "docker.io/${u}/${repoName}" }

bootBuildImage{
    imageName = imageBase.zip(gitSha) { base, sha -> "${base}:${sha}" }

    tags = imageBase.map { base ->
        ["${base}:latest".toString(), "${base}:${project.version}".toString()]
    }
    environment = [
            'BP_JVM_VERSION'    : '21',
            'BPE_APPEND_JAVA_TOOL_OPTIONS': '-XX:MaxRAMPercentage=75'
    ]
    publish = true
    docker {
        publishRegistry {
            url      = 'https://index.docker.io/v1/'
            username = project.findProperty('registryUser') ?: System.getenv('REGISTRY_USER')
            password = project.findProperty('registryPass') ?: System.getenv('REGISTRY_PASS')
        }
    }
}

// Lombok's @Log4j2 needs a real Log4j2 backend. Boot's default starter brings
// Logback plus the log4j-to-slf4j bridge; leaving it in alongside
// spring-boot-starter-log4j2 puts log4j-to-slf4j and log4j-slf4j2-impl on the
// same classpath, which route into each other.
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'redis.clients:jedis'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.18.0'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.18.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
