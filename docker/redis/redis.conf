# =============================================================================
# redis.conf  -  cache-only node for a URL shortener
# Mount at: ./docker/redis/redis.conf
#
# The governing assumption: THIS IS A CACHE, NOT A DATABASE. Everything in here
# follows from that. Losing the entire dataset must be a latency event, not a
# data-loss event. If that is not true for you, stop and re-read your design.
# =============================================================================

# --- networking --------------------------------------------------------------
bind 0.0.0.0
# protected-mode no          # safe only because the port is not published in prod
port 6379
# must be <= net.core.somaxconn (set in compose)
tcp-backlog 4096
tcp-keepalive 60
# never drop idle clients; Lettuce holds long-lived conns
timeout 0

# --- memory and eviction -----------------------------------------------------
# Set to ~70% of the container limit. The rest absorbs fragmentation, client
# output buffers, and the copy-on-write spike if a fork ever happens.
maxmemory 2gb

# allkeys-lfu, not allkeys-lru. Short-link traffic is heavily Zipfian: a few
# hundred links get most of the clicks. LRU is fooled by a scan or a crawler
# that touches a million cold keys once and evicts your hot set. LFU counts
# frequency, so a single access does not promote a key over one accessed daily.
maxmemory-policy allkeys-lfu
# sampling accuracy; 10 is a good speed/quality point
maxmemory-samples 10
lfu-log-factor 10
# counters halve every minute of idleness
lfu-decay-time 1

# --- persistence: OFF --------------------------------------------------------
# RDB snapshots fork the process. On a multi-GB dataset that fork stalls the
# event loop for hundreds of milliseconds and every client sees a latency spike.
# AOF costs write amplification for data you can regenerate from Postgres.
save ""
appendonly no
stop-writes-on-bgsave-error no

# --- lazy free ---------------------------------------------------------------
# Freeing a large value synchronously blocks the single event loop thread.
# Under eviction pressure at high volume this is a real source of p99 spikes.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# --- background work ---------------------------------------------------------
hz 10
dynamic-hz yes
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# --- threaded I/O ------------------------------------------------------------
# Redis executes commands on one thread; io-threads only parallelises socket
# read/write. Worth enabling above roughly 50k ops/sec on a multi-core host.
# Below that it is neutral or slightly negative. Measure before turning it on.
# io-threads 4

# --- client output buffers ---------------------------------------------------
# A pub/sub subscriber that stops reading will otherwise grow unbounded and OOM
# the whole instance. Not used by @Cacheable, but cheap insurance.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 32mb 8mb 60

# --- observability -----------------------------------------------------------
# record any event over 100ms -> LATENCY LATEST
latency-monitor-threshold 100
# microseconds, so 10ms
slowlog-log-slower-than 10000
slowlog-max-len 256

# --- keyspace notifications --------------------------------------------------
# Off by default; they cost CPU on every expiry. Enable only if something
# actually subscribes (e.g. an eviction-rate monitor).
# notify-keyspace-events Ex

# --- dangerous commands ------------------------------------------------------
# rename-command still works but is deprecated in favour of ACLs. The modern
# equivalent, if the app user should never be able to wipe the cache:
#
#   user app on >CHANGEME ~* +@all -@dangerous +get +set +setex +getex +del +scan +ttl +unlink
#   user default off
#
# Note that the app never needs KEYS anyway, because RedisCacheConfig uses
# BatchStrategies.scan(1000) instead of the default KEYS-based clear.
