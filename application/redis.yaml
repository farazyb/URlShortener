apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: urlshortner
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: urlshortner
  labels:
    app: Redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      name: redis
      labels:
        app: redis
    spec:
      volumes:
        - name: config
          configMap:
            name: redis-config
      containers:
        - name: redis
          image: redis:latest
          command:
            - redis-server
            - "/usr/local/etc/redis/redis.conf"
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
          ports:
            - containerPort: 6379
              protocol: TCP
      restartPolicy: Always

      